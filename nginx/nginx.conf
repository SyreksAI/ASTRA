server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # SPA — все запросы к фронтенду
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # WebSocket для чата — ВАЖНО: должен быть выше, чем /api/,
    # иначе /api/ перехватит /api/chat/ws и не отдаст Upgrade.
    # ============================================================
    location /api/chat/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket — долгое соединение, таймауты большие
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # ============================================================
    # API (REST) — прокси на бекенд
    # ============================================================
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # ============================================================
    # Swagger документация
    # ============================================================
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================================
    # Загруженные файлы (аватарки, обложки, картинки постов)
    # ============================================================
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # Скрытые файлы (.git, .env и т.д.)
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}