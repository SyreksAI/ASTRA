server {
    listen 80;
    server_name localhost;

    # Корневая папка с собранным React
    root /app/frontend-build;
    index index.html;

    # ============================================
    # ОСНОВНОЙ МАРШРУТ (SPA)
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
        
        # Кэширование для статики
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # HTML не кэшируем
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ============================================
    # API (прокси на FastAPI)
    # ============================================
    location /api/ {
        proxy_pass http://localhost:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для больших запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Максимальный размер тела запроса (для картинок)
        client_max_body_size 10M;
    }

    # ============================================
    # SWAGGER ДОКУМЕНТАЦИЯ
    # ============================================
    location /docs {
        proxy_pass http://localhost:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://localhost:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================
    # ЗАГРУЖЕННЫЕ ФАЙЛЫ (картинки, видео)
    # ============================================
    location /uploads/ {
        alias /app/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Разрешаем только определённые типы
        location ~* \.(jpg|jpeg|png|gif|webp|svg|mp4|webm)$ {
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================
    # ОБРАБОТКА ОШИБОК
    # ============================================
    # 404 -> отдаём index.html (для React Router)
    error_page 404 /index.html;
    location = /index.html {
        root /app/frontend-build;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 500, 502, 503, 504 -> страница ошибки
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ============================================
    # ЗАПРЕТ ДОСТУПА К СКРЫТЫМ ФАЙЛАМ
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # ЗАПРЕТ ДОСТУПА К BACKEND ФАЙЛАМ
    # ============================================
    location ~* (app|BD|nginx) {
        deny all;
        return 404;
    }
}