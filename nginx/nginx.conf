# Локальная конфигурация Rexon (Docker Desktop / Windows)
# Открывайте приложение: http://localhost:8080
# Vite на хосте: порт 3000 (см. frontend/vite.config.js)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream astra_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Docker DNS, только IPv4 — иначе host.docker.internal уходит в недоступный IPv6
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25M;

    # --- WebSocket чата (выше общего /api/) ---
    location /api/chat/ws {
        proxy_pass http://astra_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://astra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://astra_backend/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://astra_backend/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://astra_backend/redoc;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://astra_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Собранный фронт (npm run build), если есть dist ---
    # Важно: exact-match, иначе try_files → /index.html снова попадает в proxy ниже → 502
    location = /index.html {
        root /usr/share/nginx/html;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location @spa_static {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # --- Dev: Vite + HMR; fallback на статику из dist ---
    location / {
        set $vite_upstream host.docker.internal:3000;
        proxy_pass http://$vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_static;
    }

    # Только скрытые файлы в корне (/.env), не node_modules/.vite
    location ~ ^/\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
