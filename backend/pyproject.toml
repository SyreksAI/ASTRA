[project]
name = "astra-backend"
version = "0.1.0"
description = "Social Network API Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "redis==5.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "psycopg2-binary==2.9.9",
    # Явно фиксируем Pydantic v1 для совместимости с FastAPI 0.104.1
    "pydantic==1.10.13",
    # Для загрузки переменных окружения используем только dotenv, без pydantic-settings
    "python-dotenv==1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "black==23.11.0",
    "ruff==0.1.6",
    "mypy==1.7.0"
]