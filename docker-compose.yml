# Rexon — локальный запуск (Windows / Docker Desktop), без внешних сервисов.
# Точка входа: http://localhost:8080  (Nginx)
# Фронт в dev: npm run dev в frontend/ → Vite :3000 (прокси через Nginx)
# API напрямую: http://localhost:8000

name: astra-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: astra-local-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - astra_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - astra_local_net

  redis:
    image: redis:7-alpine
    container_name: astra-local-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - astra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - astra_local_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-local-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - astra_uploads:/app/uploads
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - astra_local_net

  nginx:
    image: nginx:1.27-alpine
    container_name: astra-local-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - astra_local_net

volumes:
  astra_postgres_data:
    name: astra_local_postgres_data
  astra_redis_data:
    name: astra_local_redis_data
  astra_uploads:
    name: astra_local_uploads

networks:
  astra_local_net:
    name: astra_local_net
    driver: bridge
